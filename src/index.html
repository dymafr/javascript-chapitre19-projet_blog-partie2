<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/83f4286022.js"
      crossorigin="anonymous"
    ></script>
    <title>Blog</title>
    <script type="module" src="./index.js"></script>
  </head>
  <body>
    <div class="container">
      <header>
        <a class="header-brand" href="./index.html">Blog</a>
        <div class="header-menu">
          <nav aria-label="Navigation principale">
            <ul>
              <li>
                <a
                  href="./index.html"
                  class="header-nav active"
                  aria-current="page"
                >
                  Accueil
                </a>
              </li>
              <li>
                <a href="./form/form.html" class="header-nav">
                  Créer un article
                </a>
              </li>
            </ul>
          </nav>
          <button
            type="button"
            class="header-menu-icon"
            aria-label="Ouvrir le menu"
            aria-expanded="false"
          >
            <i class="fas fa-bars" aria-hidden="true"></i>
          </button>
        </div>
      </header>
      <main class="content">
        <aside class="sidebar" aria-label="Tri et catégories">
          <label for="sort-order">Trier les articles</label>
          <select id="sort-order">
            <option value="desc">Le plus récent</option>
            <option value="asc">Le plus ancien</option>
          </select>
          <ul class="categories"></ul>
        </aside>
        <section class="articles-container" aria-live="polite"></section>
      </main>
      <footer><small>© Blog</small></footer>
    </div>
  </body>
</html>
